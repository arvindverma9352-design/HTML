<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .box{
            width: 100px;
            height: 100px;
            border: 1px solid;
        }

        .box1{
            position: absolute;
            left: 200px;
            top: 100px;
            background-color: red;
        }

        .box2{
            position: relative;
            top: 50px;
            left: 150px;
            background-color: blue;
        }

        .box3{
            position: fixed;
            right: 0px;
            bottom: 0px;
            background-color: gray;
        }

        .box4{
            position: sticky;
            top: 20px;
            background-color: yellow;
        }
    </style>
</head>

<body>

    <div class="box box1">absolute</div>
    <div class="box box2">relative</div>
    <div class="box box3">fixed</div>
    <div class="box box4">sticky</div>

    <div style="height: 1000px;"></div>

</body>
</html>
