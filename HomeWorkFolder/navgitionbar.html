<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Three Navbar Designs</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f2f2f2;
    padding:40px;
}

.navbar{
    background:#24252A;
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 60px;
    margin-bottom:80px;
}

.logo{
    color:white;
    font-size:28px;
    font-weight:bold;
}

.menu{
    display:flex;
    list-style:none;
}

.menu li{
    margin:0 18px;
}

.menu li a{
    color:white;
    text-decoration:none;
    font-size:18px;
}

.btn{
    text-decoration:none;
    color:white;
    background:#00bcd4;
    padding:10px 25px;
    border-radius:30px;
}

/* ---------- Navbar 2 ---------- */

.navbar2{
    background:#24252A;
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 60px;
    margin-bottom:80px;
}

.left{
    display:flex;
    align-items:center;
}

.left .menu{
    margin-right:30px;
}

.rightlogo{
    color:white;
    font-size:28px;
    font-weight:bold;
}

/* ---------- Navbar 3 ---------- */

.navbar3{
    background:#24252A;
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 60px;
}

.right{
    display:flex;
    align-items:center;
}

.right .menu{
    margin-right:25px;
}

</style>

</head>

<body>

<!-- Navbar 1 -->

<div class="navbar">

<div class="logo">LOGOBAKERY</div>

<ul class="menu">
<li><a href="#">Services</a></li>
<li><a href="#">Projects</a></li>
<li><a href="#">About</a></li>
</ul>

<a href="#" class="btn">Contact</a>

</div>

<!-- Navbar 2 -->

<div class="navbar2">

<div class="left">

<ul class="menu">
<li><a href="#">Services</a></li>
<li><a href="#">Projects</a></li>
<li><a href="#">About</a></li>
</ul>

<a href="#" class="btn">Contact</a>

</div>

<div class="rightlogo">LOGOBAKERY</div>

</div>

<!-- Navbar 3 -->

<div class="navbar3">

<div class="logo">LOGOBAKERY</div>

<div class="right">

<ul class="menu">
<li><a href="#">Services</a></li>
<li><a href="#">Projects</a></li>
<li><a href="#">About</a></li>
</ul>

<a href="#" class="btn">Contact</a>

</div>

</div>

</body>
</html>
