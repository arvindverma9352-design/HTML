<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pill Navbar</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#f4f4f4;
}

.navbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:700px;
    background:#1f1f1f;
    padding:8px;
    border-radius:50px;
    box-shadow:0 8px 20px rgba(0,0,0,.3);
}

.logo{
    width:50px;
    height:50px;
    background:#fff;
    color:#000;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:24px;
    font-weight:bold;
}

.menu{
    display:flex;
    list-style:none;
    gap:30px;
}

.menu li a{
    color:#fff;
    text-decoration:none;
    font-size:18px;
    transition:.3s;
}

.menu li a:hover{
    color:#00c8ff;
}

.email{
    background:#fff;
    color:#000;
    padding:12px 28px;
    border-radius:30px;
    text-decoration:none;
    font-size:16px;
    font-weight:bold;
}
</style>

</head>
<body>

<nav class="navbar">

    <div class="logo">✦</div>

    <ul class="menu">
        <li><a href="#">Work</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Playground</a></li>
        <li><a href="#">Resource</a></li>
    </ul>

    <a href="#" class="email">hyper@gmail.com</a>

</nav>

</body>
</html>
