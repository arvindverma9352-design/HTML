<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            width: 700px;height: 700px;
            background: #fff;
            position: relative;
        }
        .box{
            position: absolute;
        }
        .green{
            width: 140px;height: 140px;border: 1px solid;
            background: green;
            top: 60px;
            left: 70px;
        
        }
        .blue{
            width: 140px;height: 140px;border: 1px solid;
            right: 0px;
            background: blue;
            top: 60px;
            right: 108px;
            
        }
        .center{
            width: 240px;height: 240px;border: 1px solid;
            margin-top: 200px;
            margin-left: 210px;
            background: orangered;
        }
        .orange{
            width: 140px;height: 140px;border: 1px solid;
            bottom: 0px;
            background: orange;
            bottom: 118px;
            left: 70px;

        }
        .yellow{
            width: 140px;height: 140px;border: 1px solid;
            bottom: 0px;
            right: 0px;
            background: yellow;
            bottom: 118px;
            right: 108px;
        }

    </style>
    
</head>

<body>
    <div class="container">
        <div class="box green"></div>
        <div class="box blue"></div>
        <div class="box center"></div>
        <div class="box orange"></div>
        <div class="box yellow"></div>
    </div>


</body>
</html>
